name: "Keep Hermes Alive"

on:
  # Run every 20 minutes
  schedule:
    - cron: '*/20 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📋 Checkout repo
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        run: pip install requests
      
      - name: 🔗 Ping Hermes Keepalive
        run: |
          # Read tunnel URL from secrets
          TUNNEL_URL="${{ secrets.HERMES_TUNNEL_URL }}"
          echo "Pinging: $TUNNEL_URL/ping"
          
          # Ping with timeout
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 "$TUNNEL_URL/ping")
          echo "Response code: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Hermes is alive!"
          else
            echo "⚠️ Hermes might be down (got $HTTP_CODE)"
            exit 1
          fi
      
      - name: 📊 Log Status
        run: echo "Keepalive ping completed at $(date -u)"

  # Also restart Colab if needed
  check-restart:
    runs-on: ubuntu-latest
    # Only run if the keepalive job failed
    needs: keepalive
    if: failure()
    
    steps:
      - name: 🚨 Alert - Hermes Down
        run: |
          echo "::error::Hermes appears to be down! Open Colab and restart the notebook."
          # You can add notification actions here (Discord webhook, email, etc.)
          # Example Discord webhook:
          # curl -H "Content-Type: application/json" -d '{"content":"🚨 Hermes is DOWN! Restart Colab notebook!"}' ${{ secrets.DISCORD_WEBHOOK_URL }}
      
      - name: 📝 Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Hermes Keepalive Failed - Restart Needed',
              body: 'The keepalive ping failed at ' + new Date().toISOString() + '. Open Colab and restart the notebook.',
              labels: ['urgent', 'bot-down']
            })
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
